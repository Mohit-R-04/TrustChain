version: "3.8"

services:
  backend:
    build: ./backend
    container_name: trustchain-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - APP_CORS_ALLOWED_ORIGIN_PATTERNS=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000,http://localhost:80,http://frontend:3000}
    restart: unless-stopped
    networks:
      - trustchain-network
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build: ./frontend
    container_name: trustchain-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - trustchain-network

networks:
  trustchain-network:
    driver: bridge
