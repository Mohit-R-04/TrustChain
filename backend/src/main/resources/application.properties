# Application Name
spring.application.name=TrustChain

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Supabase PostgreSQL Database Configuration (Transaction Pooler)
# Disable server-side prepared statements (PgBouncer transaction pooling + prepared statements can cause "already exists" errors)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=${SUPABASE_DB_SSLMODE:disable}&prepareThreshold=0&preparedStatementCacheQueries=0&preparedStatementCacheSizeMiB=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# Database Flush Configuration
trustchain.db.flush-on-start=${TRUSTCHAIN_DB_FLUSH_ON_START:false}

# Clerk Authentication Configuration
clerk.secret.key=${CLERK_SECRET_KEY:}
trustchain.invoice.cid.secret=${INVOICE_CID_SECRET:${clerk.secret.key}}
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET:}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.properties.mail.smtp.auth.mechanisms=${MAIL_AUTH_MECHANISMS:LOGIN}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
# SMTP timeouts to prevent hanging threads
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

otp.delivery.mode=${OTP_DELIVERY_MODE:email}
otp.delivery.fallback-to-log=${OTP_DELIVERY_FALLBACK_TO_LOG:false}

otp.validity.seconds=${OTP_VALIDITY_SECONDS:300}
otp.cooldown.seconds=${OTP_COOLDOWN_SECONDS:30}
otp.max.attempts=${OTP_MAX_ATTEMPTS:5}
otp.verification-token.validity.seconds=${OTP_VERIFICATION_TOKEN_VALIDITY_SECONDS:600}

# CORS
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:80,http://frontend:3000}

# Blockchain (disabled by default; enable via env variables in production)
blockchain.enabled=${BLOCKCHAIN_ENABLED:false}
blockchain.demo-mode=${BLOCKCHAIN_DEMO_MODE:true}
blockchain.rpc-url=${POLYGON_AMOY_RPC:https://rpc-amoy.polygon.technology}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:80002}
blockchain.contract-address=${TRUSTCHAIN_ESCROW_CONTRACT_ADDRESS:0xd9145CCE52D386f254917e481eB44e9943F39138}
blockchain.private-key=${TRUSTCHAIN_ESCROW_PRIVATE_KEY:${PRIVATE_KEY:}}
blockchain.gas-limit=${BLOCKCHAIN_GAS_LIMIT:6000000}
blockchain.poll-interval-ms=${BLOCKCHAIN_POLL_INTERVAL_MS:10000}

# IPFS (Web3.Storage)
ipfs.web3storage.token=${IPFS_WEB3STORAGE_TOKEN:${WEB3_STORAGE_TOKEN:}}
ipfs.provider=${IPFS_PROVIDER:pinata}
ipfs.kubo.api-base-url=${IPFS_KUBO_API_BASE_URL:http://localhost:5001}
ipfs.pinata.jwt=${PINATA_JWT:}
ipfs.pinata.api-base-url=${PINATA_API_BASE_URL:https://api.pinata.cloud}
